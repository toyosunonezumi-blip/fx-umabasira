<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FX馬柱・雇用統計分析</title>
    <style>
        /* --- 共通ベース --- */
        body { background: #f0f2f5; margin: 0; padding: 0; font-family: "Helvetica Neue", Arial, sans-serif; color: #333; }
        
        /* --- 看板（ヘッダー） --- */
        .site-header { 
            background: #1a1a1a; color: #fff; padding: 15px 0; text-align: center; 
            border-bottom: 4px solid #ffca28; margin-bottom: 25px;
        }
        .site-header h1 { margin: 0; font-size: 1.5rem; letter-spacing: 2px; }
        .site-nav { margin-top: 8px; font-size: 0.85rem; }
        .site-nav a { color: #ccc; margin: 0 12px; text-decoration: none; }
        .site-nav .active { color: #ffca28; font-weight: bold; }

        .control { 
            background: #fff; padding: 15px; border-radius: 10px; margin: 0 auto 20px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); max-width: 1000px; 
            display: flex; align-items: center; justify-content: center; gap: 20px; 
        }
        .card { background: #fff; border-radius: 6px; padding: 15px 20px; max-width: 1000px; margin: 10px auto; box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; border-left: 6px solid #888; }
        
        .up { color: #d3222d; } .down { color: #1677ff; }
        .up-bg { background: #fff1f0; } .down-bg { background: #e6f4ff; }

        /* --- PC版設定 (横長ワイドでスクロール削減) --- */
        @media (min-width: 769px) {
            .card { align-items: center; gap: 25px; }
            .h-col { flex: 0 0 100px; text-align: center; border-right: 1px solid #eee; padding-right: 15px; font-weight: bold; }
            .p-col { flex: 0 0 150px; text-align: center; }
            .p-val { font-size: 2.8rem; font-weight: 900; letter-spacing: -2px; line-height: 1; }
            .tm-wrap { flex: 0 0 300px; display: flex; gap: 6px; border-left: 1px solid #eee; padding-left: 20px; justify-content: center; }
            .tm-box { flex: 0 0 65px; padding: 6px; border-radius: 4px; text-align: center; font-size: 0.75rem; font-weight: bold; }
            .d-col { flex: 1; font-size: 0.75rem; border-left: 1px solid #eee; padding-left: 20px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
            .main-flex-sp { display: contents; }
        }

        /* --- スマホ版設定 (元の縦並びレイアウトを完全復元) --- */
        @media (max-width: 768px) {
            body { padding: 10px; }
            .control { flex-direction: column; padding: 15px; }
            .card { flex-direction: column; align-items: stretch; padding: 10px; padding-top: 35px; position: relative; gap: 10px; margin: 10px; }
            .h-col { position: absolute; top: 10px; left: 15px; border: none; padding: 0; text-align: left; font-size: 0.9rem; font-weight: bold; color: #999; }
            .main-flex-sp { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; border: none; }
            .p-col { flex: 0 0 auto; text-align: left; }
            .p-val { font-size: 2.2rem; font-weight: 900; }
            .d-col { border: none; padding: 8px; background: #f9f9f9; border-radius: 6px; font-size: 0.65rem; display: flex; flex-direction: column; flex: 1; gap: 2px; }
            .d-item-sp { display: flex; justify-content: space-between; border-bottom: 1px solid #eee; padding: 2px 0; }
            .tm-wrap { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; flex: none; width: 100%; border: none; padding-left: 0; }
            .tm-box { padding: 8px 2px; font-size: 0.7rem; text-align: center; border-radius: 4px; font-weight: bold; }
        }
    </style>
</head>
<body>

<header class="site-header">
    <h1>🏇 FX馬柱・雇用統計版</h1>
    <nav class="site-nav">
        <a href="#" class="active">エントリー分析</a>
        <a href="#">過去戦績一覧</a>
        <a href="#">馬柱の読み方</a>
    </nav>
</header>

<div class="control">
    <div style="font-weight:bold;">📊 タイミング別・PIPS分析</div>
    <div>
        <select id="eSel" onchange="draw()" style="padding: 6px; border-radius: 4px; border: 1px solid #ccc; font-weight:bold;">
            <option value="1">発表 1分前</option>
            <option value="3">発表 3分前</option>
            <option value="5">発表 5分前</option>
            <option value="10">発表 10分前</option>
            <option value="15">発表 15分前</option>
            <option value="20">発表 20分前</option>
            <option value="30">発表 30分前</option>
        </select>
    </div>
</div>

<div id="box"></div>

<script>
const data = [
    {"date": "2025-12-16", "time": "22:30", "nfp": {"act": "64K", "for": "51K"}, "unemp": {"act": "4.6%", "for": "4.5%"}, "wage": {"act": "0.1%", "for": "0.3%"}, "pips": {"1": {"1": -22.2, "5": 6.2, "10": -4.9, "20": 10.0, "30": -2.5}, "3": {"1": -15.7, "5": 12.7, "10": 1.6, "20": 16.5, "30": 4.0}, "5": {"1": -17.2, "5": 11.2, "10": 0.1, "20": 15.0, "30": 2.5}, "10": {"1": -15.9, "5": 12.5, "10": 1.4, "20": 16.3, "30": 3.8}, "15": {"1": -19.6, "5": 8.8, "10": -2.3, "20": 12.6, "30": 0.1}, "20": {"1": -14.0, "5": 14.4, "10": 3.3, "20": 18.2, "30": 5.7}, "30": {"1": -13.3, "5": 15.1, "10": 4.0, "20": 18.9, "30": 6.4}}},
    // ...ここに全データを貼り付け
];

function draw() {
    const e = document.getElementById('eSel').value;
    const box = document.getElementById('box');
    
    box.innerHTML = data.map(v => {
        const p = v.pips[e];
        if (!p) return '';
        const cls = p[1] >= 0 ? 'up' : 'down';
        const borderColor = p[1] >= 0 ? '#d32' : '#167';
        
        return `
        <div class="card" style="border-left-color:${borderColor}">
            <div class="h-col">${v.date}</div>
            
            <div class="main-flex-sp">
                <div class="p-col">
                    <small style="color:#aaa; font-size:0.6rem; font-weight:bold;">1m MOVE</small>
                    <div class="p-val ${cls}">${p[1] >= 0 ? '+' : ''}${p[1]}</div>
                    <small style="color:#ccc; font-size:0.6rem; font-weight:bold;">PIPS</small>
                </div>

                <div class="d-col">
                    <div class="d-item-sp"><span style="color:#999;">🏃 NFP</span><b>${v.nfp.act}</b></div>
                    <div class="d-item-sp"><span style="color:#999;">👥 失業</span><b>${v.unemp.act}</b></div>
                    <div class="d-item-sp"><span style="color:#999;">💰 時給</span><b>${v.wage.act}</b></div>
                </div>
            </div>

            <div class="tm-wrap">
                ${[5,10,20,30].map(m => `
                    <div class="tm-box ${p[m] >= 0 ? 'up-bg' : 'down-bg'}">
                        <small style="color:#999; font-size:0.6rem;">${m}分後</small><br>
                        <span class="${p[m] >= 0 ? 'up' : 'down'}">${p[m] >= 0 ? '+' : ''}${p[m]}</span>
                    </div>
                `).join('')}
            </div>
        </div>`;
    }).join('');
}
window.onload = draw;
</script>
</body>
</html>
