<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>米雇用統計 | データベース - netFX</title>
    <style>
        body { background: #fff; margin: 0; padding: 0; font-family: "Hiragino Kaku Gothic ProN", Meiryo, sans-serif; color: #333; line-height: 1.4; }
        .site-header { background: #006837; color: #fff; padding: 12px 20px; font-weight: bold; font-size: 1.2rem; }
        .container { max-width: 1000px; margin: 0 auto; padding: 20px 10px; }

        /* プロフィール */
        .horse-profile { border-bottom: 2px solid #006837; margin-bottom: 20px; padding-bottom: 10px; }
        .horse-name { font-size: 2.2rem; font-weight: bold; margin: 0; }
        .horse-name span { font-size: 0.9rem; color: #666; font-weight: normal; margin-left: 10px; }

        /* 条件検索エリア (netkeiba風) */
        .search-box { background: #fdfaf0; border: 1px solid #e2d8b5; padding: 15px; margin-bottom: 20px; border-radius: 4px; display: flex; flex-wrap: wrap; gap: 15px; align-items: center; font-size: 0.85rem; }
        .search-item { display: flex; align-items: center; gap: 5px; }
        select { padding: 5px 10px; border-radius: 4px; border: 1px solid #ccc; font-weight: bold; cursor: pointer; }

        /* タブ */
        .tab-menu { display: flex; border-bottom: 1px solid #ccc; margin-bottom: 20px; }
        .tab-item { padding: 12px 20px; font-size: 0.9rem; font-weight: bold; border: 1px solid transparent; margin-bottom: -1px; }
        .tab-active { background: #fff; border: 1px solid #ccc; border-bottom: 1px solid #fff; color: #006837; }

        /* 戦績表 */
        .race-table-wrap { overflow-x: auto; }
        .race-table { width: 100%; border-collapse: collapse; font-size: 0.75rem; min-width: 900px; }
        .race-table th { background: #f2f2f2; border: 1px solid #ddd; padding: 10px 5px; text-align: center; color: #666; }
        .race-table td { border: 1px solid #ddd; padding: 10px 5px; text-align: center; }
        .race-table tr:hover { background: #fffde7; }
        
        .pips-plus { color: #d32; font-weight: bold; }
        .pips-minus { color: #167; font-weight: bold; }
        .forecast-val { color: #999; font-size: 0.7rem; display: block; }
        .judge-icon { font-size: 1.4rem; }
        .no-data { padding: 40px; text-align: center; color: #999; font-weight: bold; }

        @media (max-width: 768px) {
            .horse-name { font-size: 1.6rem; }
            .search-box { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>

<header class="site-header">netFX - 指標データベース</header>

<div class="container">
    <div class="horse-profile">
        <p style="color:#666; font-size:0.8rem; margin:0;">[米G1] 雇用・労働市場</p>
        <h1 class="horse-name">米雇用統計<span>US Employment Report</span></h1>
    </div>

    <div class="tab-menu">
        <div class="tab-item tab-active">戦績</div>
        <div class="tab-item">掲示板</div>
        <div class="tab-item">予想</div>
    </div>

    <div class="search-box">
        <div class="search-item">
            <b>表示年:</b>
            <select id="ySel" onchange="draw()">
                <option value="all">すべて</option>
                <option value="2026">2026年</option>
                <option value="2025">2025年</option>
                <option value="2024">2024年</option>
                <option value="2023">2023年</option>
                <option value="2022">2022年</option>
                <option value="2021">2021年</option>
            </select>
        </div>
        <div class="search-item">
            <b>表示月:</b>
            <select id="mSel" onchange="draw()">
                <option value="all">すべて</option>
                ${[...Array(12)].map((_, i) => `<option value="${(i+1).toString().padStart(2, '0')}">${i+1}月</option>`).join('')}
            </select>
        </div>
        <div class="search-item">
            <b>エントリー:</b>
            <select id="eSel" onchange="draw()">
                <option value="1">1分前</option>
                <option value="3">3分前</option>
                <option value="5">5分前</option>
                <option value="10">10分前</option>
                <option value="15">15分前</option>
                <option value="20">20分前</option>
                <option value="30">30分前</option>
            </select>
        </div>
    </div>

    <div class="race-table-wrap">
        <table class="race-table">
            <thead>
                <tr>
                    <th>日付</th>
                    <th>発表</th>
                    <th>判定</th>
                    <th style="background:#fffafa">初動(1m)</th>
                    <th>5分後</th>
                    <th>10分後</th>
                    <th>20分後</th>
                    <th>30分後</th>
                    <th>NFP</th>
                    <th>失業率</th>
                    <th>時給</th>
                </tr>
            </thead>
            <tbody id="box">
                </tbody>
        </table>
    </div>
</div>

<script>
const data = [
    // ※ ここにお手持ちの全データを貼り付け
    {"date": "2025-12-16", "time": "22:30", "nfp": {"act": "64K", "for": "51K"}, "unemp": {"act": "4.6%", "for": "4.5%"}, "wage": {"act": "0.1%", "for": "0.3%"}, "pips": {"1": {"1": -22.2, "5": 6.2, "10": -4.9, "20": 10.0, "30": -2.5}, "3": {"1": -15.7, "5": 12.7, "10": 1.6, "20": 16.5, "30": 4.0}, "5": {"1": -17.2, "5": 11.2, "10": 0.1, "20": 15.0, "30": 2.5}, "10": {"1": -15.9, "5": 12.5, "10": 1.4, "20": 16.3, "30": 3.8}, "15": {"1": -19.6, "5": 8.8, "10": -2.3, "20": 12.6, "30": 0.1}, "20": {"1": -14.0, "5": 14.4, "10": 3.3, "20": 18.2, "30": 5.7}, "30": {"1": -13.3, "5": 15.1, "10": 4.0, "20": 18.9, "30": 6.4}}},
    {"date": "2025-07-03", "time": "21:30", "nfp": {"act": "147K", "for": "111K"}, "unemp": {"act": "4.1%", "for": "4.3%"}, "wage": {"act": "0.2%", "for": "0.3%"}, "pips": {"1": {"1": 112.3, "5": 116.8, "10": 105.9, "20": 140.3, "30": 125.2}, "3": {"1": 98.7, "5": 103.2, "10": 92.3, "20": 126.7, "30": 111.6}, "5": {"1": 95.8, "5": 100.3, "10": 89.4, "20": 123.8, "30": 108.7}, "10": {"1": 105.0, "5": 109.5, "10": 98.6, "20": 133.0, "30": 117.9}, "15": {"1": 96.1, "5": 100.6, "10": 89.7, "20": 124.1, "30": 109.0}, "20": {"1": 92.7, "5": 97.2, "10": 86.3, "20": 120.7, "30": 105.6}, "30": {"1": 100.4, "5": 104.9, "10": 94.0, "20": 128.4, "30": 113.3}}}
];

function draw() {
    const y = document.getElementById('ySel').value;
    const m = document.getElementById('mSel').value;
    const e = document.getElementById('eSel').value;
    const box = document.getElementById('box');
    
    // --- フィルタリング実行 ---
    const filtered = data.filter(d => {
        const [year, month] = d.date.split('-');
        const yMatch = (y === 'all' || y === year);
        const mMatch = (m === 'all' || m === month);
        return yMatch && mMatch;
    });

    if (filtered.length === 0) {
        box.innerHTML = '<tr><td colspan="11" class="no-data">指定された条件のデータはありません。</td></tr>';
        return;
    }

    box.innerHTML = filtered.map(v => {
        const p = v.pips[e];
        if (!p) return '';
        
        // 判定ロジック
        let judge = { emoji: '🤔', label: '混戦' };
        if (Math.abs(p[1]) < 5) judge = { emoji: '😐', label: '織り込み' };
        else if (p[1] >= 10 && p[30] <= -2) judge = { emoji: '📉', label: '上髭騙し' };
        else if (p[1] <= -10 && p[30] >= 2) judge = { emoji: '📈', label: '下髭騙し' };
        else if (Math.abs(p[1]) >= 12 && Math.abs(p[30]) <= 5) judge = { emoji: '🔄', label: '全戻し' };
        else if (p[1] > 15 && p[30] > p[1]) judge = { emoji: '🤩', label: '爆上げ' };
        else if (p[1] < -15 && p[30] < p[1]) judge = { emoji: '😭', label: '爆下げ' };

        const getCls = (val) => val >= 0 ? 'pips-plus' : 'pips-minus';

        return `
        <tr>
            <td>${v.date}</td>
            <td>${v.time}</td>
            <td class="judge-icon" title="${judge.label}">${judge.emoji}</td>
            <td class="${getCls(p[1])}" style="background:#fffafa">${p[1] >= 0 ? '+' : ''}${p[1]}</td>
            <td class="${getCls(p[5])}">${p[5] >= 0 ? '+' : ''}${p[5]}</td>
            <td class="${getCls(p[10])}">${p[10] >= 0 ? '+' : ''}${p[10]}</td>
            <td class="${getCls(p[20])}">${p[20] >= 0 ? '+' : ''}${p[20]}</td>
            <td class="${getCls(p[30])}">${p[30] >= 0 ? '+' : ''}${p[30]}</td>
            <td><b>${v.nfp.act}</b><span class="forecast-val">(予:${v.nfp.for})</span></td>
            <td><b>${v.unemp.act}</b><span class="forecast-val">(予:${v.unemp.for})</span></td>
            <td><b>${v.wage.act}</b><span class="forecast-val">(予:${v.wage.for})</span></td>
        </tr>`;
    }).join('');
}

window.onload = draw;
</script>
</body>
</html>
