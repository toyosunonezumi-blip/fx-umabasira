<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>米雇用統計 | 指標データベース - netFX</title>
    <style>
        body { background: #fff; margin: 0; padding: 0; font-family: "Hiragino Kaku Gothic ProN", Meiryo, sans-serif; color: #333; line-height: 1.4; }
        
        /* 看板 (netkeibaカラー) */
        .site-header { background: #006837; color: #fff; padding: 12px 20px; font-weight: bold; font-size: 1.2rem; }
        .container { max-width: 1000px; margin: 0 auto; padding: 20px 10px; }

        /* 馬名プロフィール */
        .horse-profile { border-bottom: 2px solid #006837; margin-bottom: 20px; padding-bottom: 10px; }
        .horse-name { font-size: 2.2rem; font-weight: bold; margin: 0; }
        .horse-name span { font-size: 0.9rem; color: #666; font-weight: normal; margin-left: 10px; }
        .stats-summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 15px; background: #f5f5f5; padding: 15px; border-radius: 4px; font-size: 0.85rem; }
        .stats-item b { font-size: 1.1rem; color: #d32; }

        /* タブ */
        .tab-menu { display: flex; border-bottom: 1px solid #ccc; margin-bottom: 20px; }
        .tab-item { padding: 12px 25px; font-size: 0.9rem; font-weight: bold; cursor: pointer; border: 1px solid transparent; margin-bottom: -1px; }
        .tab-active { background: #fff; border: 1px solid #ccc; border-bottom: 1px solid #fff; color: #006837; }

        /* 条件選択 */
        .control-area { background: #fdfaf0; border: 1px solid #e2d8b5; padding: 10px 15px; margin-bottom: 20px; font-size: 0.9rem; border-radius: 4px; }
        select { padding: 6px; border-radius: 4px; border: 1px solid #ccc; font-weight: bold; }

        /* 戦績表 */
        .race-table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        .race-table { width: 100%; border-collapse: collapse; font-size: 0.75rem; min-width: 900px; }
        .race-table th { background: #f2f2f2; border: 1px solid #ddd; padding: 10px 5px; text-align: center; color: #666; font-weight: normal; }
        .race-table td { border: 1px solid #ddd; padding: 10px 5px; text-align: center; }
        .race-table tr:hover { background: #fffde7; }
        
        .pips-plus { color: #d32; font-weight: bold; }
        .pips-minus { color: #167; font-weight: bold; }
        .forecast-val { color: #999; font-weight: normal; font-size: 0.7rem; display: block; }
        .judge-icon { font-size: 1.4rem; cursor: help; }

        @media (max-width: 768px) {
            .horse-name { font-size: 1.6rem; }
        }
    </style>
</head>
<body>

<header class="site-header">netFX - 経済指標データベース</header>

<div class="container">
    <div class="horse-profile">
        <p style="color:#666; font-size:0.8rem; margin:0;">[米G1] 雇用・労働市場</p>
        <h1 class="horse-name">米雇用統計<span>US Employment Report</span></h1>
        
        <div class="stats-summary">
            <div class="stats-item">通算：<b>60戦以上</b></div>
            <div class="stats-item">脚質：<b>マクリ（波乱型）</b></div>
            <div class="stats-item">開催：<b>毎月第一金曜</b></div>
            <div class="stats-item">賞金：<b>ドル円ボラ大</b></div>
        </div>
    </div>

    <div class="tab-menu">
        <div class="tab-item tab-active">戦績</div>
        <div class="tab-item">掲示板</div>
        <div class="tab-item">血統</div>
        <div class="tab-item">予想</div>
    </div>

    <div class="control-area">
        <b>🔍 条件を絞り込む：</b>
        エントリー時間 
        <select id="eSel" onchange="draw()">
            <option value="1">1分前</option>
            <option value="3">3分前</option>
            <option value="5">5分前</option>
            <option value="10">10分前</option>
            <option value="15">15分前</option>
            <option value="20">20分前</option>
            <option value="30">30分前</option>
        </select>
    </div>

    <div class="race-table-wrap">
        <table class="race-table">
            <thead>
                <tr>
                    <th>日付</th>
                    <th>発表</th>
                    <th>判定</th>
                    <th style="background:#fff1f0">1分後</th>
                    <th>5分後</th>
                    <th>10分後</th>
                    <th>20分後</th>
                    <th>30分後</th>
                    <th>NFP</th>
                    <th>失業率</th>
                    <th>平均時給</th>
                </tr>
            </thead>
            <tbody id="box">
                </tbody>
        </table>
    </div>
</div>

<script>
// データは既存のものをすべて使用
const data = [
    {"date": "2025-12-16", "time": "22:30", "nfp": {"act": "64K", "for": "51K"}, "unemp": {"act": "4.6%", "for": "4.5%"}, "wage": {"act": "0.1%", "for": "0.3%"}, "pips": {"1": {"1": -22.2, "5": 6.2, "10": -4.9, "20": 10.0, "30": -2.5}, "3": {"1": -15.7, "5": 12.7, "10": 1.6, "20": 16.5, "30": 4.0}, "5": {"1": -17.2, "5": 11.2, "10": 0.1, "20": 15.0, "30": 2.5}, "10": {"1": -15.9, "5": 12.5, "10": 1.4, "20": 16.3, "30": 3.8}, "15": {"1": -19.6, "5": 8.8, "10": -2.3, "20": 12.6, "30": 0.1}, "20": {"1": -14.0, "5": 14.4, "10": 3.3, "20": 18.2, "30": 5.7}, "30": {"1": -13.3, "5": 15.1, "10": 4.0, "20": 18.9, "30": 6.4}}},
    {"date": "2025-11-20", "time": "22:30", "nfp": {"act": "119K", "for": "53K"}, "unemp": {"act": "4.4%", "for": "4.3%"}, "wage": {"act": "0.2%", "for": "0.3%"}, "pips": {"1": {"1": -15.5, "5": -17.7, "10": -23.7, "20": 10.0, "30": -0.5}, "3": {"1": -18.2, "5": -20.4, "10": -26.4, "20": 7.3, "30": -3.2}, "5": {"1": -21.3, "5": -23.5, "10": -29.5, "20": 4.2, "30": -6.3}, "10": {"1": -23.7, "5": -25.9, "10": -31.9, "20": 1.8, "30": -8.7}, "15": {"1": -24.4, "5": -26.6, "10": -32.6, "20": 1.1, "30": -9.4}, "20": {"1": -19.6, "5": -21.8, "10": -27.8, "20": 5.9, "30": -4.6}, "30": {"1": -23.0, "5": -25.2, "10": -31.2, "20": 2.5, "30": -8.0}}},
    {"date": "2025-07-03", "time": "21:30", "nfp": {"act": "147K", "for": "111K"}, "unemp": {"act": "4.1%", "for": "4.3%"}, "wage": {"act": "0.2%", "for": "0.3%"}, "pips": {"1": {"1": 112.3, "5": 116.8, "10": 105.9, "20": 140.3, "30": 125.2}, "3": {"1": 98.7, "5": 103.2, "10": 92.3, "20": 126.7, "30": 111.6}, "5": {"1": 95.8, "5": 100.3, "10": 89.4, "20": 123.8, "30": 108.7}, "10": {"1": 105.0, "5": 109.5, "10": 98.6, "20": 133.0, "30": 117.9}, "15": {"1": 96.1, "5": 100.6, "10": 89.7, "20": 124.1, "30": 109.0}, "20": {"1": 92.7, "5": 97.2, "10": 86.3, "20": 120.7, "30": 105.6}, "30": {"1": 100.4, "5": 104.9, "10": 94.0, "20": 128.4, "30": 113.3}}}
    // ※お手元のデータをここにすべて貼り付けてください
];

function draw() {
    const e = document.getElementById('eSel').value;
    const box = document.getElementById('box');
    
    box.innerHTML = data.map(v => {
        const p = v.pips[e];
        if (!p) return '';
        
        // --- 判定ロジック ---
        const p1 = p[1];
        const p30 = p[30];
        let judge = { emoji: '🤔', label: '混戦' };

        if (Math.abs(p1) < 5) judge = { emoji: '😐', label: '織り込み' };
        else if (p1 >= 10 && p30 <= -2) judge = { emoji: '📉', label: '上髭騙し' };
        else if (p1 <= -10 && p30 >= 2) judge = { emoji: '📈', label: '下髭騙し' };
        else if (Math.abs(p1) >= 12 && Math.abs(p30) <= 5) judge = { emoji: '🔄', label: '全戻し' };
        else if (p1 > 15 && p30 > p1) judge = { emoji: '🤩', label: '爆上げ' };
        else if (p1 < -15 && p30 < p1) judge = { emoji: '😭', label: '爆下げ' };

        const getPipsCls = (val) => val >= 0 ? 'pips-plus' : 'pips-minus';

        return `
        <tr>
            <td>${v.date}</td>
            <td>${v.time}</td>
            <td class="judge-icon" title="${judge.label}">${judge.emoji}</td>
            <td class="${getPipsCls(p[1])}" style="background:#fffafa">${p[1] >= 0 ? '+' : ''}${p[1]}</td>
            <td class="${getPipsCls(p[5])}">${p[5] >= 0 ? '+' : ''}${p[5]}</td>
            <td class="${getPipsCls(p[10])}">${p[10] >= 0 ? '+' : ''}${p[10]}</td>
            <td class="${getPipsCls(p[20])}">${p[20] >= 0 ? '+' : ''}${p[20]}</td>
            <td class="${getPipsCls(p[30])}">${p[30] >= 0 ? '+' : ''}${p[30]}</td>
            <td><b>${v.nfp.act}</b><span class="forecast-val">(予:${v.nfp.for})</span></td>
            <td><b>${v.unemp.act}</b><span class="forecast-val">(予:${v.unemp.for})</span></td>
            <td><b>${v.wage.act}</b><span class="forecast-val">(予:${v.wage.for})</span></td>
        </tr>`;
    }).join('');
}

window.onload = draw;
</script>
</body>
</html>
