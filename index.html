<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { background: #f0f2f5; padding: 10px; font-family: "Helvetica Neue", Arial, sans-serif; color: #333; margin: 0; }
        .control { background: #fff; padding: 15px; border-radius: 10px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); max-width: 950px; margin-left: auto; margin-right: auto; }
        .control-flex { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
        
        .card { background: #fff; border-radius: 8px; padding: 15px; max-width: 950px; margin: 10px auto; box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; align-items: center; gap: 15px; border-left: 6px solid #888; }
        
        .h-col { flex: 0 0 100px; text-align:center; border-right: 1px solid #eee; padding-right: 10px; font-weight: bold; font-size: 0.9rem; }
        .p-col { flex: 0 0 110px; text-align: center; }
        .p-val { font-size: 2rem; font-weight: 900; letter-spacing: -1px; line-height: 1; }
        .up { color: #d3222d; } .down { color: #1677ff; }
        .up-bg { background: #fff1f0; } .down-bg { background: #e6f4ff; }
        
        .tm-grid { flex: 1; display: flex; gap: 5px; flex-wrap: wrap; }
        .tm-box { flex: 1; padding: 4px; border-radius: 4px; text-align: center; font-size: 0.7rem; font-weight: bold; min-width: 55px; }
        
        .d-col { flex: 1.5; font-size: 0.75rem; border-left: 1px solid #eee; padding-left: 15px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; }

        /* --- スマホ用レイアウト --- */
        @media (max-width: 768px) {
            .card { flex-direction: column; align-items: stretch; gap: 10px; position: relative; padding-top: 40px; }
            .h-col { position: absolute; top: 10px; left: 15px; border-right: none; padding: 0; text-align: left; font-size: 1rem; }
            .p-col { display: flex; align-items: baseline; gap: 10px; text-align: left; border-bottom: 1px solid #f0f0f0; padding-bottom: 10px; }
            .p-val { font-size: 2.2rem; }
            .tm-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
            .tm-box { padding: 8px; font-size: 0.8rem; }
            .d-col { border-left: none; padding-left: 0; border-top: 1px solid #f0f0f0; padding-top: 10px; }
        }
    </style>
</head>
<body>

<div class="control">
    <div class="control-flex">
        <div style="font-weight:bold; font-size:1.1rem;">📊 PIPS分析</div>
        <div>
            <select id="eSel" onchange="draw()" style="padding: 8px; border-radius: 4px; border: 1px solid #ccc; font-weight:bold; cursor:pointer;">
                <option value="1">発表 1分前</option>
                <option value="3">発表 3分前</option>
                <option value="5">発表 5分前</option>
                <option value="10">発表 10分前</option>
                <option value="15">発表 15分前</option>
                <option value="20">発表 20分前</option>
                <option value="30">発表 30分前</option>
            </select>
        </div>
    </div>
</div>

<div id="box"></div>

<script>
// データ部分は元のままなので省略せず保持してください
const data = [/* ここにあなたのJSONデータを流用 */];

function draw() {
    const e = document.getElementById('eSel').value;
    const box = document.getElementById('box');
    if (!data || data.length === 0) {
        box.innerHTML = '<div style="text-align:center; padding:50px; color:#999;">データがありません。</div>';
        return;
    }
    
    box.innerHTML = data.map(v => {
        const p = v.pips[e]; if (!p) return '';
        const cls = p[1]>=0 ? 'up' : 'down';
        const borderColor = p[1]>=0 ? '#d3222d' : '#1677ff';
        
        return `
        <div class="card" style="border-left-color:${borderColor}">
            <div class="h-col">${v.date}</div>
            
            <div class="p-col">
                <div class="p-val ${cls}">${p[1]>=0?'+':''}${p[1]}</div>
                <div style="display:flex; flex-direction:column;">
                    <small style="color:#aaa; font-size:0.6rem; font-weight:bold;">1分後</small>
                    <small style="color:#ccc; font-size:0.6rem; font-weight:bold;">PIPS</small>
                </div>
            </div>
            
            <div class="tm-grid">
                ${[5,10,20,30].map(m => `
                    <div class="tm-box ${p[m]>=0?'up-bg':'down-bg'}">
                        <span style="color:#999; font-size:0.6rem;">${m}分後</span><br>
                        <span class="${p[m]>=0?'up':'down'}">${p[m]>=0?'+':''}${p[m]}</span>
                    </div>
                `).join('')}
            </div>
            
            <div class="d-col">
                <div><small style="color:#999;">🏃 NFP</small><br><b>${v.nfp.act}</b> <small style="color:#ccc;">(${v.nfp.for})</small></div>
                <div><small style="color:#999;">👥 失業</small><br><b>${v.unemp.act}</b> <small style="color:#ccc;">(${v.unemp.for})</small></div>
                <div><small style="color:#999;">💰 時給</small><br><b>${v.wage.act}</b> <small style="color:#ccc;">(${v.wage.for})</small></div>
            </div>
        </div>`;
    }).join('');
}
draw();
</script>
</body>
</html>
