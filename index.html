<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>米雇用統計 | 競走馬データ - netFX</title>
    <style>
        /* --- netkeiba再現ベース --- */
        body { background: #fff; margin: 0; padding: 0; font-family: "Hiragino Kaku Gothic ProN", Meiryo, sans-serif; color: #333; line-height: 1.4; }
        
        /* 看板 */
        .site-header { background: #006837; color: #fff; padding: 10px 20px; font-weight: bold; font-size: 1.2rem; }
        
        .container { max-width: 1000px; margin: 0 auto; padding: 20px 10px; }

        /* 馬名プロフィールエリア */
        .horse-profile { border-bottom: 2px solid #006837; margin-bottom: 20px; padding-bottom: 10px; }
        .horse-name { font-size: 2rem; font-weight: bold; margin: 0; display: flex; align-items: center; gap: 10px; }
        .horse-name span { font-size: 0.9rem; color: #666; font-weight: normal; }
        .stats-summary { display: grid; grid-template-columns: repeat(auto-fit, minwidth: 150px); gap: 10px; margin-top: 15px; background: #f5f5f5; padding: 15px; border-radius: 4px; font-size: 0.85rem; }
        .stats-item b { font-size: 1.1rem; color: #d32; }

        /* タブ */
        .tab-menu { display: flex; border-bottom: 1px solid #ccc; margin-bottom: 20px; }
        .tab-item { padding: 10px 20px; font-size: 0.9rem; font-weight: bold; cursor: pointer; border: 1px solid transparent; margin-bottom: -1px; }
        .tab-active { background: #fff; border: 1px solid #ccc; border-bottom: 1px solid #fff; color: #006837; }

        /* 戦績表（ここが肝！） */
        .race-table-wrap { overflow-x: auto; }
        .race-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; min-width: 800px; }
        .race-table th { background: #f0f0f0; border: 1px solid #ddd; padding: 8px; text-align: center; color: #666; }
        .race-table td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        .race-table tr:nth-child(even) { background: #fafafa; }
        
        /* 着順（pips）の色付け */
        .pips-plus { color: #d32; font-weight: bold; }
        .pips-minus { color: #167; font-weight: bold; }
        .judge-icon { font-size: 1.2rem; }

        /* コントロール */
        .control-area { margin-bottom: 20px; display: flex; align-items: center; gap: 10px; font-size: 0.9rem; }
        select { padding: 5px; border-radius: 4px; border: 1px solid #ccc; }

        /* スマホ対応 */
        @media (max-width: 768px) {
            .horse-name { font-size: 1.5rem; }
            .stats-summary { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>

<header class="site-header">netFX - 雇用統計データベース</header>

<div class="container">
    <div class="horse-profile">
        <p style="color:#666; font-size:0.8rem; margin:0;">[米G1] 月例・重要指標</p>
        <h1 class="horse-name">米雇用統計 <span>US Employment Report</span></h1>
        
        <div class="stats-summary">
            <div class="stats-item">通算成績：<b>60戦</b></div>
            <div class="stats-item">脚質：<b>追い込み</b></div>
            <div class="stats-item">得意時間：<b>22:30(冬)</b></div>
            <div class="stats-item">平均値幅：<b>±25.5 pips</b></div>
        </div>
    </div>

    <div class="tab-menu">
        <div class="tab-item tab-active">戦績</div>
        <div class="tab-item">掲示板</div>
        <div class="tab-item">血統</div>
        <div class="tab-item">予想</div>
    </div>

    <div class="control-area">
        <b>表示条件：</b>
        エントリー時間 <select id="eSel" onchange="draw()">
            <option value="1">1分前</option>
            <option value="5">5分前</option>
            <option value="15">15分前</option>
        </select>
    </div>

    <div class="race-table-wrap">
        <table class="race-table">
            <thead>
                <tr>
                    <th>開催日</th>
                    <th>発表</th>
                    <th>判定</th>
                    <th>1m Move</th>
                    <th>5分後</th>
                    <th>10分後</th>
                    <th>20分後</th>
                    <th>30分後</th>
                    <th>NFP</th>
                    <th>失業率</th>
                    <th>時給</th>
                </tr>
            </thead>
            <tbody id="box">
                </tbody>
        </table>
    </div>
</div>

<script>
// データ (抜粋)
const data = [
    {"date": "2025-12-16", "time": "22:30", "nfp": {"act": "64K", "for": "51K"}, "unemp": {"act": "4.6%", "for": "4.5%"}, "wage": {"act": "0.1%", "for": "0.3%"}, "pips": {"1": {"1": -22.2, "5": 6.2, "10": -4.9, "20": 10.0, "30": -2.5}}},
    {"date": "2025-07-03", "time": "21:30", "nfp": {"act": "147K", "for": "111K"}, "unemp": {"act": "4.1%", "for": "4.3%"}, "wage": {"act": "0.2%", "for": "0.3%"}, "pips": {"1": {"1": 112.3, "5": 116.8, "10": 105.9, "20": 140.3, "30": 125.2}}}
    // ...Kennyさんの全データをここに貼り付け
];

function draw() {
    const e = document.getElementById('eSel').value;
    const box = document.getElementById('box');
    
    box.innerHTML = data.map(v => {
        const p = v.pips[e];
        if (!p) return '';
        
        // 簡易判定ロジック
        const face = p[1] > 20 ? '🤩' : (p[1] < -20 ? '😭' : '😐');
        const p1Class = p[1] >= 0 ? 'pips-plus' : 'pips-minus';

        return `
        <tr>
            <td>${v.date}</td>
            <td>${v.time}</td>
            <td class="judge-icon">${face}</td>
            <td class="${p1Class}">${p[1] >= 0 ? '+' : ''}${p[1]}</td>
            <td class="${p[5] >= 0 ? 'pips-plus' : 'pips-minus'}">${p[5] >= 0 ? '+' : ''}${p[5]}</td>
            <td class="${p[10] >= 0 ? 'pips-plus' : 'pips-minus'}">${p[10] >= 0 ? '+' : ''}${p[10]}</td>
            <td class="${p[20] >= 0 ? 'pips-plus' : 'pips-minus'}">${p[20] >= 0 ? '+' : ''}${p[20]}</td>
            <td class="${p[30] >= 0 ? 'pips-plus' : 'pips-minus'}">${p[30] >= 0 ? '+' : ''}${p[30]}</td>
            <td><b>${v.nfp.act}</b></td>
            <td><b>${v.unemp.act}</b></td>
            <td><b>${v.wage.act}</b></td>
        </tr>`;
    }).join('');
}

window.onload = draw;
</script>
</body>
</html>
