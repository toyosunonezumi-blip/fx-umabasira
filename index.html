<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { background: #f0f2f5; padding: 10px; font-family: "Helvetica Neue", Arial, sans-serif; color: #333; margin: 0; }
        .control { background: #fff; padding: 15px; border-radius: 10px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); max-width: 950px; margin: auto; }
        .control-flex { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
        
        .card { background: #fff; border-radius: 8px; padding: 15px; max-width: 950px; margin: 10px auto; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border-left: 6px solid #888; position: relative; }
        
        /* PCレイアウト */
        .card-inner { display: flex; align-items: center; gap: 15px; }
        .h-col { flex: 0 0 100px; text-align:center; border-right: 1px solid #eee; padding-right: 10px; font-weight: bold; font-size: 0.9rem; }
        .p-col { flex: 0 0 110px; text-align: center; }
        .p-val { font-size: 2rem; font-weight: 900; letter-spacing: -1px; line-height: 1; }
        .up { color: #d3222d; } .down { color: #1677ff; }
        .up-bg { background: #fff1f0; } .down-bg { background: #e6f4ff; }
        
        .tm-grid { flex: 2; display: flex; gap: 5px; }
        .tm-box { flex: 1; padding: 4px; border-radius: 4px; text-align: center; font-size: 0.7rem; font-weight: bold; }
        
        .d-col { flex: 1.5; font-size: 0.75rem; border-left: 1px solid #eee; padding-left: 15px; display: grid; gap: 2px; }

        /* --- スマホ用レイアウト修正 --- */
        @media (max-width: 768px) {
            .card { padding: 10px; padding-top: 35px; }
            .card-inner { flex-direction: column; align-items: stretch; gap: 8px; }
            
            /* 日付を左上に配置 */
            .h-col { position: absolute; top: 8px; left: 12px; border: none; padding: 0; text-align: left; font-size: 0.85rem; }
            
            /* メイン行：1分後PIPS と 指標(NFP等) を横に並べる */
            .main-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
            
            .p-col { text-align: left; flex: 0 0 auto; }
            .p-val { font-size: 2.2rem; }
            
            /* 指標データを右側の空きスペースへ */
            .d-col { border: none; padding: 4px 8px; background: #f8f9fa; border-radius: 6px; font-size: 0.65rem; flex: 1; display: flex; flex-direction: column; justify-content: center; }
            .d-item { display: flex; justify-content: space-between; border-bottom: 1px solid #eee; padding: 1px 0; }
            .d-item:last-child { border: none; }
            
            /* 5分後〜30分後を最下段に横並び */
            .tm-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
            .tm-box { padding: 6px 2px; font-size: 0.75rem; }
        }
    </style>
</head>
<body>
